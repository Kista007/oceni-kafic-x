<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <!-- Prilagođeno za mobilne telefone i touch ekrane -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocenite vaše iskustvo</title>
    
    <!-- Tailwind CSS preko CDN-a -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Uklanjanje plavog okvira pri dodiru na mobilnom */
        * { -webkit-tap-highlight-color: transparent; }
        
        /* Mikro-animacije za zvezdice */
        .star-btn {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s ease;
        }
        .star-btn:active {
            transform: scale(1.35) rotate(-5deg);
        }

        /* Topla kaveno-staklena kartica */
        .coffee-card {
            background: rgba(255, 253, 250, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-stone-100 to-amber-100/80 min-h-screen flex items-center justify-center p-4 font-sans text-stone-800">

    <!-- Glavna kartica -->
    <div class="coffee-card w-full max-w-sm rounded-3xl p-6 sm:p-8 shadow-2xl shadow-amber-950/10 border border-amber-200/60 text-center transition-all duration-300">
        
        <!-- Logo lokala -->
        <div class="relative w-20 h-20 mx-auto mb-4">
            <img src="https://via.placeholder.com/100" alt="Logo" id="cafe-logo" class="w-full h-full object-cover rounded-full shadow-md border-2 border-amber-200">
        </div>

        <h2 id="cafe-name" class="text-2xl font-bold text-amber-950 tracking-tight">Kafić / Restoran</h2>
        <p id="main-prompt" class="text-sm text-stone-600 mt-1 mb-6 leading-relaxed">
            Kako biste ocenili vaše današnje iskustvo sa nama?
        </p>

        <!-- SEKCIJA 1: Zvezdice -->
        <div id="stars-box" class="flex justify-center items-center gap-2 mb-1">
            <button type="button" class="star-btn text-4xl text-stone-200 focus:outline-none" data-value="1">&#9733;</button>
            <button type="button" class="star-btn text-4xl text-stone-200 focus:outline-none" data-value="2">&#9733;</button>
            <button type="button" class="star-btn text-4xl text-stone-200 focus:outline-none" data-value="3">&#9733;</button>
            <button type="button" class="star-btn text-4xl text-stone-200 focus:outline-none" data-value="4">&#9733;</button>
            <button type="button" class="star-btn text-4xl text-stone-200 focus:outline-none" data-value="5">&#9733;</button>
        </div>
        
        <!-- Tekstualni opis ocene -->
        <p id="star-label" class="text-xs font-semibold h-5 text-stone-400 mb-6 transition-all duration-200"></p>

        <!-- SEKCIJA 2: Interna forma (za ocene 1, 2 i 3) -->
        <div id="complaint-box" class="hidden text-left space-y-4">
            <button type="button" id="back-btn" class="w-full text-xs font-medium text-stone-500 hover:text-stone-800 py-2 mt-2 transition-colors">
            ← Promeni ocenu
            </button>
            <div>
                <label for="guest-name" class="block text-xs font-semibold text-stone-700 mb-1">Vaše ime (opciono):</label>
                <input type="text" id="guest-name" placeholder="Npr. Marko" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm focus:ring-2 focus:ring-amber-700 focus:border-transparent outline-none bg-stone-50/80 transition-all">
            </div>
            <div>
                <label for="guest-contact" class="block text-xs font-semibold text-stone-700 mb-1">Telefon ili e-mail (opciono):</label>
                <input type="text" id="guest-contact" placeholder="Za kontakt ukoliko želite da rešimo problem" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm focus:ring-2 focus:ring-amber-700 focus:border-transparent outline-none bg-stone-50/80 transition-all">
            </div>
            <div>
                <label for="guest-comment" class="block text-xs font-semibold text-stone-700 mb-1">Šta možemo da popravimo? *</label>
                <textarea id="guest-comment" placeholder="Opišite vaš utisak..." required class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm focus:ring-2 focus:ring-amber-700 focus:border-transparent outline-none bg-stone-50/80 h-24 resize-none transition-all"></textarea>
            </div>
            <button type="button" id="send-btn" class="w-full bg-amber-800 hover:bg-amber-900 active:scale-[0.98] text-amber-50 font-semibold py-3 px-4 rounded-xl shadow-lg shadow-amber-900/20 transition-all text-sm">
                Pošalji utisak
            </button>
        </div>

        <!-- SEKCIJA 3: Poruka zahvalnosti -->
        <div id="success-box" class="hidden py-4">
            <div class="w-16 h-16 bg-amber-100 text-amber-800 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                ✓
            </div>
            <h3 class="text-xl font-bold text-amber-950 mb-1">Hvala vam!</h3>
            <p class="text-xs text-stone-600 leading-relaxed">
                Vaš komentar je prosleđen direktno menadžmentu lokala kako bismo poboljšali našu uslugu.
            </p>
        </div>

    </div>

    <!-- JavaScript Logika -->
    <script>
        // 1. Google Review link klijenta za ocene 4 i 5
        const GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=PRIMER_GOOGLE_ID";
        
        // 2. Tvoj sačuvani Google Apps Script URL za ocene 1, 2 i 3
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-LdK9p9OdJyhzTdEUROVi6PCGIh3yIanw-uNTXEjvI8iWtK2RdhN3G1Mo4gJlpIAO/exec";

        let selectedRating = 0;

        const stars = document.querySelectorAll('.star-btn');
        const starLabel = document.getElementById('star-label');
        const starsBox = document.getElementById('stars-box');
        const complaintBox = document.getElementById('complaint-box');
        const successBox = document.getElementById('success-box');
        const mainPrompt = document.getElementById('main-prompt');
        const sendBtn = document.getElementById('send-btn');

        // Topli, kaveni tonovi za ocene (od terracotte do bogate espresso/zlatne boje)
        const ratingConfig = {
            1: { label: "Nedovoljno / Loše", color: "#c2410c" },  
            2: { label: "Moglo je bolje", color: "#ea580c" },      
            3: { label: "Prosečno iskustvo", color: "#d97706" },   
            4: { label: "Veoma dobro!", color: "#b45309" },       
            5: { label: "Odlično iskustvo!", color: "#78350f" }     
        };

        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.getAttribute('data-value'));

                stars.forEach(s => {
                    const val = parseInt(s.getAttribute('data-value'));
                    if (val <= selectedRating) {
                        s.style.color = ratingConfig[selectedRating].color;
                    } else {
                        s.style.color = '#e7e5e4'; // stone-200
                    }
                });

                starLabel.innerText = ratingConfig[selectedRating].label;
                starLabel.style.color = ratingConfig[selectedRating].color;

                setTimeout(() => {
                    if (selectedRating >= 4) {
                        window.location.href = GOOGLE_REVIEW_URL;
                    } else {
                        starsBox.classList.add('hidden');
                        starLabel.classList.add('hidden');
                        mainPrompt.innerText = "Žao nam je što niste u potpunosti zadovoljni. Pomozite nam da budemo bolji:";
                        complaintBox.classList.remove('hidden');
                    }
                }, 350);
            });
        });

        // Slanje forme ka Google Apps Script-u
        sendBtn.addEventListener('click', function() {
            const comment = document.getElementById('guest-comment').value.trim();
            const name = document.getElementById('guest-name').value.trim();
            const contact = document.getElementById('guest-contact').value.trim();

            if (!comment) {
                alert("Molimo vas da unesete komentar kako bismo znali šta treba da popravimo.");
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = "Slanje u toku...";

            const payload = {
                rating: selectedRating,
                name: name,
                contact: contact,
                comment: comment
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                complaintBox.classList.add('hidden');
                mainPrompt.classList.add('hidden');
                successBox.classList.remove('hidden');
            })
            .catch(error => {
                console.error('Greška:', error);
                alert("Došlo je do greške pri slanju.");
                sendBtn.disabled = false;
                sendBtn.innerText = "Pošalji utisak";
            });
        });
        const backBtn = document.getElementById('back-btn');

backBtn.addEventListener('click', function() {
    // 1. Sakrij formu i prikaži zvezdice
    complaintBox.classList.add('hidden');
    starsBox.classList.remove('hidden');
    starLabel.classList.remove('hidden');
    
    // 2. Vrati originalni naslov
    mainPrompt.innerText = "Kako biste ocenili vaše današnje iskustvo sa nama?";
    
    // 3. Resetuj zvezdice i izabranu ocenu
    selectedRating = 0;
    starLabel.innerText = '';
    stars.forEach(s => {
        s.style.color = '#e7e5e4'; // Vraća na sivu boju
    });
});
    </script>
</body>
</html>
